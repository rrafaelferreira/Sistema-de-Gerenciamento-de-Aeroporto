<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <title>Airport Management System</title>
</head>
<body>
    <main id="container-forms">

        <div class="form-image">
            <img src="assets/images/bglogin-morning.jpg" alt="Aeroporto">
        </div>

        <div class="form">

            <!-- Formulário de Login -->
            <form class="login-form" action="" method="post">
                <h1 class="loginh1">Login</h1>

                <div class="input-box">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" 
                    name="cpf" required 
                    placeholder="00000000000" 
                    maxlength="11" 
                    inputmode="numeric">
                    <i class="bx bx-user"></i>
                </div>

                <div class="input-box">
                    <label for="password">Senha</label>
                    <input type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Senha" 
                    required>
                    <i class="bx bx-lock"></i>
                </div>

                <button type="submit" class="login-btn">Login</button>

                <div class="remember-forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <div class="register-link">
                    <p class="buttontext">
                        Don't have an account?
                        <button type="button" class="btn-register">Register</button>
                    </p>
                </div>
            </form>



            <!---------------------------->
            <!-- Formulário de Cadastro -->
            <!---------------------------->

            <form class="register-form" action="" method="post">
                <h1 class="loginh1">Register</h1>

                <div class="input-box">
                    <label for="register-name">Nome</label>
                    <input type="text" 
                    id="register-name" 
                    name="name" 
                    placeholder="Digite seu nome" 
                    autocomplete="name" 
                    required>
                    <i class="bx bx-user"></i>
                </div>

                <div class="input-box">
                    <label for="register-cpf">CPF</label>
                    <input type="text" 
                    id="register-cpf" 
                    name="cpf" 
                    placeholder="00000000000" 
                    maxlength="11" 
                    inputmode="numeric" 
                    required>
                    <i class="bx bx-id-card"></i>
                </div>

                <div class="input-box">
                    <label for="register-email">E-mail</label>
                    <input type="email" id="register-email" name="email" placeholder="seuemail@email.com" autocomplete="email" required>
                    <i class="bx bx-envelope"></i>
                </div>

                <div class="input-box">
                    <label for="register-password">Senha</label>
                    <input type="password" 
                    id="register-password" 
                    name="password" 
                    placeholder="Digite sua senha" 
                    autocomplete="new-password" 
                    required>
                    <i class="bx bx-lock"></i>
                </div>

                <div class="input-box">
                    <label for="confirm-password">Confirmar Senha</label>
                    <input type="password" 
                    id="confirm-password" 
                    name="confirm-password" 
                    placeholder="Confirme sua senha" 
                    autocomplete="new-password" 
                    required>
                    <i class="bx bx-lock"></i>
                </div>

                <button type="submit" class="register-btn">Cadastrar</button>

                <div class="register-link">
                    <p class="buttontext">
                        Already have an account?
                        <button type="button" class="btn-login">Login</button>
                    </p>
                </div>
            </form>

        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
